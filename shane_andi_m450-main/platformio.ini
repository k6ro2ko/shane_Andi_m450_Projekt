; PlatformIO-Konfiguration
;
; Ein Environment pro Board. Auswahl mit -e, z.B.:
;   pio run -e uno -t upload      Firmware fuer Arduino Uno bauen und hochladen
;   pio test -e native            Tests auf dem PC, ohne Board
;
; Die Versionen der Plattformen sind fest eingetragen, damit der Build auf jedem
; Rechner (Schule, zu Hause, Windows, Linux, macOS) gleich ist.

[platformio]
default_envs = pico

; Gilt fuer alle Environments
[env]
monitor_speed = 115200
test_framework = unity
test_build_src = no

; ---------------------------------------------------------------------------
; Boards
; ---------------------------------------------------------------------------

[env:pico]
; Raspberry Pi Pico W mit Arduino-Core von Earle Philhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipicow
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool

[env:uno]
platform = platformio/atmelavr@5.3.0
board = uno
framework = arduino

[env:nano]
; Bei aelteren Nano-Klonen "nanoatmega328" statt "nanoatmega328new" verwenden.
platform = platformio/atmelavr@5.3.0
board = nanoatmega328new
framework = arduino

[env:mega]
platform = platformio/atmelavr@5.3.0
board = megaatmega2560
framework = arduino

; ---------------------------------------------------------------------------
; Tests auf dem PC (kein Board noetig). Nur fuer `pio test`, nicht fuer `pio run`.
; Benoetigt einen C++-Compiler (g++/clang, unter Windows z.B. MinGW/MSYS2).
; ---------------------------------------------------------------------------

[env:native]
platform = platformio/native@1.2.1
build_flags = -Wall -Wextra
